name: Logos

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "scripts/fetch-logos.sh"
      - ".github/workflows/logos.yml"

# Like the screenshots: protected main is never pushed to, the logos are committed onto the pull request's branch.
permissions:
  contents: write
  actions: write

concurrency:
  group: logos-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  logos:
    name: Fetch network logos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref || '' }}
      - name: Fetch logos
        run: bash scripts/fetch-logos.sh | tee "$RUNNER_TEMP/logos.log"
      - name: Summary
        if: always()
        run: |
          { echo '### Network logos'; echo '```'; cat "$RUNNER_TEMP/logos.log" 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Commit logos
        id: commit
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          logos=custom_components/public_transport/frontend/logos
          if [ -z "$(git status --porcelain "$logos")" ]; then
            echo "No logo changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$logos"
          git commit -m "chore: refresh network logos [skip ci]"
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"
      - name: Re-run checks on the logo commit
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          for wf in lint.yml validate.yml hacs.yml; do
            [ -f ".github/workflows/$wf" ] && gh workflow run "$wf" --ref "$HEAD_REF"
          done
      - name: Upload logos artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logos
          path: custom_components/public_transport/frontend/logos/
